name: Playwright Tests

# Credentials come from repository secrets (Settings > Secrets and variables >
# Actions):
#   AICOACH_EMAIL     - staging account email
#   AICOACH_PASSWORD  - staging account password
#
# Test selection:
#   push / pull_request        -> "smoke" (fast, non-mutating tests only)
#   nightly schedule           -> "smoke" (see the cron note below)
#   manual (workflow_dispatch) -> choose "smoke", "full" or "coach-me"
#
# "full" runs the agent chat-creation tests too - these create real chats and
# trigger ~2-minute AI runs on the shared staging account, so they are
# intentionally kept out of the per-push run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly run at 23:00 Romania time.
  #
  # GitHub cron is ALWAYS UTC and does not follow daylight saving, while Romania
  # does (EET = UTC+2 in winter, EEST = UTC+3 in summer). One fixed expression
  # therefore cannot be 23:00 all year:
  #
  #   20:00 UTC  ->  23:00 EEST (summer, in effect now)  /  22:00 EET (winter)
  #
  # Change to '0 21 * * *' at the October clock change to stay on 23:00, and
  # back to '0 20 * * *' in March.
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        options: [smoke, full, coach-me]
        default: smoke

# One run per ref; cancel superseded runs.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E (${{ github.event.inputs.suite || 'smoke' }})
    runs-on: ubuntu-latest
    # The Coach Me answer suites alone are ~36 real AI runs (~20 min), and CI
    # sets retries: 2, so a handful of failures triples their cost. 45 min was
    # not enough headroom for a nightly that must finish.
    timeout-minutes: 90
    env:
      # Map repository secrets to the env vars the suite reads.
      EMAIL: ${{ secrets.AICOACH_EMAIL }}
      PASSWORD: ${{ secrets.AICOACH_PASSWORD }}
      # CI-friendly runtime config (bundled Chromium, headless). CI=true also
      # enables retries in playwright.config.ts (the suite is always
      # single-worker, so the run uses one browser).
      BROWSER: chromium
      HEADLESS: 'true'
    steps:
      # v7 of these actions runs on Node 24. The v4 line targeted Node 20, which
      # GitHub retired for action runtimes, so every run logged a deprecation
      # warning and was force-run on Node 24 anyway.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 20 is end-of-life; 24 also matches what the suite is developed
          # against locally, so CI and local runs cannot diverge on runtime.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      # Without credentials every credentialed test calls test.skip(), so the
      # run would report success while asserting nothing - a nightly that is
      # green because it did no work is worse than one that is red. Fail loudly
      # instead.
      - name: Verify credentials are configured
        run: |
          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "::error::AICOACH_EMAIL / AICOACH_PASSWORD repository secrets are not set."
            echo "::error::Without them every credentialed test skips and this run would pass without testing anything."
            echo "Set them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Credentials present for ${EMAIL%%@*}@..."

      - name: Run tests
        run: |
          case "${{ github.event.inputs.suite }}" in
            full)
              echo "Running FULL suite (includes mutating chat-creation tests)"
              npx playwright test
              ;;
            coach-me)
              echo "Running COACH ME suites only"
              npm run test:coach-me:everything
              ;;
            *)
              # Also the path taken by push, pull_request and the nightly cron.
              echo "Running SMOKE suite (excluding mutating chat-creation tests)"
              npx playwright test --grep-invert "should create a"
              ;;
          esac

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
