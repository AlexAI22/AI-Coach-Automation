name: Playwright Tests

# Credentials come from repository secrets (Settings > Secrets and variables >
# Actions):
#   AICOACH_EMAIL     - staging account email
#   AICOACH_PASSWORD  - staging account password
#
# Test selection:
#   push / pull_request        -> "smoke"   (fast, NO AI runs - see below)
#   nightly schedule           -> "nightly" (smoke + the AI answer suites)
#   manual (workflow_dispatch) -> smoke | answers | nightly | full | coach-me
#
# WHY SMOKE NO LONGER INCLUDES THE ANSWER SUITES. "Smoke" used to mean
# everything except the chat-creation tests, which still left the three Coach Me
# ANSWER specs in: 21 test cases driving 36 real AI runs at 15-70s each. With
# retries: 2 a failing answer test costs up to 15 minutes on its own, and a run
# with 15 failures burned 45 attempts and was killed by the 90-minute job
# timeout - producing no failure summary and no report artifact, because both
# are written only at the end of a run. Per-push CI is now fast and always
# reports; the AI load moved to the nightly.
#
# "full" also runs the agent chat-creation tests - these create real chats on the
# shared staging account, so they stay out of every automatic run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly run at 23:00 Romania time.
  #
  # GitHub cron is ALWAYS UTC and does not follow daylight saving, while Romania
  # does (EET = UTC+2 in winter, EEST = UTC+3 in summer). One fixed expression
  # therefore cannot be 23:00 all year:
  #
  #   20:00 UTC  ->  23:00 EEST (summer, in effect now)  /  22:00 EET (winter)
  #
  # Change to '0 21 * * *' at the October clock change to stay on 23:00, and
  # back to '0 20 * * *' in March.
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        options: [smoke, answers, nightly, full, coach-me]
        default: smoke

# One run per ref; cancel superseded runs.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E (${{ github.event.inputs.suite || 'smoke' }})
    runs-on: ubuntu-latest
    # Smoke finishes in ~10 minutes. The cap is sized for the nightly, which
    # adds ~36 real AI runs; it also lowers RETRIES to 1 and passes
    # --max-failures so a bad night FAILS FAST WITH A REPORT rather than being
    # killed at the cap with nothing to read.
    timeout-minutes: 90
    env:
      # Map repository secrets to the env vars the suite reads.
      EMAIL: ${{ secrets.AICOACH_EMAIL }}
      PASSWORD: ${{ secrets.AICOACH_PASSWORD }}
      # CI-friendly runtime config (bundled Chromium, headless). CI=true also
      # enables retries in playwright.config.ts (the suite is always
      # single-worker, so the run uses one browser).
      BROWSER: chromium
      HEADLESS: 'true'
    steps:
      # v7 of these actions runs on Node 24. The v4 line targeted Node 20, which
      # GitHub retired for action runtimes, so every run logged a deprecation
      # warning and was force-run on Node 24 anyway.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 20 is end-of-life; 24 also matches what the suite is developed
          # against locally, so CI and local runs cannot diverge on runtime.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      # Without credentials every credentialed test calls test.skip(), so the
      # run would report success while asserting nothing - a nightly that is
      # green because it did no work is worse than one that is red. Fail loudly
      # instead.
      - name: Verify credentials are configured
        run: |
          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; then
            echo "::error::AICOACH_EMAIL / AICOACH_PASSWORD repository secrets are not set."
            echo "::error::Without them every credentialed test skips and this run would pass without testing anything."
            echo "Set them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Credentials present for ${EMAIL%%@*}@..."

      - name: Run tests
        env:
          # A failing AI-answer test costs 2-5 minutes PER ATTEMPT, so the
          # nightly halves the retry budget the fast suites keep.
          RETRIES: ${{ (github.event_name == 'schedule' || github.event.inputs.suite == 'nightly' || github.event.inputs.suite == 'answers') && '1' || '2' }}
        run: |
          # Every AI-answer case is titled "...should return a usable answer",
          # and every chat-creation case "should create a ...", so both groups
          # are selectable by title without a tagging scheme.
          AI_ANSWERS="should return a usable answer"
          MUTATING="should create a"

          SUITE="${{ github.event.inputs.suite }}"
          if [ -z "$SUITE" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then SUITE=nightly; else SUITE=smoke; fi
          fi
          echo "Selected suite: $SUITE"

          case "$SUITE" in
            full)
              echo "FULL - everything, including the mutating chat-creation tests"
              npx playwright test
              ;;
            coach-me)
              echo "COACH ME - all six Coach Me specs"
              npm run test:coach-me:everything
              ;;
            answers)
              echo "ANSWERS - the AI answer suites only (~36 real AI runs)"
              npx playwright test --grep "$AI_ANSWERS" --max-failures=10
              ;;
            nightly)
              echo "NIGHTLY - everything non-mutating, AI answer suites included"
              npx playwright test --grep-invert "$MUTATING" --max-failures=20
              ;;
            *)
              echo "SMOKE - no AI runs, no mutating tests"
              npx playwright test --grep-invert "$MUTATING|$AI_ANSWERS"
              ;;
          esac

      # always(), NOT !cancelled(): a job killed by the timeout is CANCELLED, so
      # !cancelled() skipped this step in exactly the run where the report was
      # most needed.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
